<!DOCTYPE html>
<html>
<head>
    <title>Flex Wrap Example</title>

        <style>

                body{
                            background:black;
                                        font-family:Arial;
                                                }

                                                        .container{
                                                                    display:flex;
                                                                                flex-wrap:wrap;
                                                                                            gap:20px;
                                                                                                        padding:20px;
                                                                                                                }

                                                                                                                        .box{
                                                                                                                                    width:200px;
                                                                                                                                                height:120px;
                                                                                                                                                            background:linear-gradient(to right,gold,silver);
                                                                                                                                                                        border-radius:15px;
                                                                                                                                                                                    text-align:center;
                                                                                                                                                                                                line-height:120px;
                                                                                                                                                                                                            font-size:22px;
                                                                                                                                                                                                                        font-weight:bold;
                                                                                                                                                                                                                                    color:black;
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                    <div class="container">

                                                                                                                                                                                                                                                            <div class="box">Box 1</div>
                                                                                                                                                                                                                                                                    <div class="box">Box 2</div>
                                                                                                                                                                                                                                                                            <div class="box">Box 3</div>
                                                                                                                                                                                                                                                                                    <div class="box">Box 4</div>
                                                                                                                                                                                                                                                                                            <div class="box">Box 5</div>
                                                                                                                                                                                                                                                                                                    <div class="box">Box 6</div>

                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                        </html>
