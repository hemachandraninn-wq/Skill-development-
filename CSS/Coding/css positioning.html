<!DOCTYPE html>
<html>

<head>

    <title>CSS Positioning</title>

        <style>

                .static{
                            position: static;
                                        border: 2px solid black;
                                                    padding: 10px;
                                                                margin-bottom: 20px;
                                                                        }

                                                                                .relative{
                                                                                            position: relative;
                                                                                                        left: 40px;
                                                                                                                    border: 2px solid blue;
                                                                                                                                padding: 10px;
                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                    }

                                                                                                                                                            .absolute{
                                                                                                                                                                        position: absolute;
                                                                                                                                                                                    top: 250px;
                                                                                                                                                                                                left: 250px;
                                                                                                                                                                                                            border: 2px solid red;
                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                        .fixed{
                                                                                                                                                                                                                                                    position: fixed;
                                                                                                                                                                                                                                                                bottom: 10px;
                                                                                                                                                                                                                                                                            right: 10px;
                                                                                                                                                                                                                                                                                        border: 2px solid green;
                                                                                                                                                                                                                                                                                                    padding: 10px;
                                                                                                                                                                                                                                                                                                                background-color: white;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                .sticky{
                                                                                                                                                                                                                                                                                                                                            position: sticky;
                                                                                                                                                                                                                                                                                                                                                        top: 0;
                                                                                                                                                                                                                                                                                                                                                                    background-color: yellow;
                                                                                                                                                                                                                                                                                                                                                                                padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                            border: 2px solid orange;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                            body{
                                                                                                                                                                                                                                                                                                                                                                                                                        height: 1500px;
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>

                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1 class="sticky">
                                                                                                                                                                                                                                                                                                                                                                                                                                                Sticky Position
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="static">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                Static Position
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="relative">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Relative Position
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="absolute">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Absolute Position
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="fixed">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Fixed Position
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Scroll down to see fixed and sticky positioning effects.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
