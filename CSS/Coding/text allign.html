<!DOCTYPE html>
<html>
<head>
<style>
h1 {
    text-align: center;
}

p.left {
    text-align: left;
}

p.right {
    text-align: right;
}

p.justify {
    text-align: justify;
}
</style>
</head>
<body>

<h1>Text Alignment Example</h1>

<p class="left">This text is aligned to the left.</p>

<p class="right">This text is aligned to the right.</p>

<p class="justify">
This paragraph is justified. The text is spread evenly across both left and right margins.
</p>

</body>
</html>
