<!DOCTYPE html>
<html>
<head>
    <title>CSS Transition Example</title>

        <style>

                body{
                            background:black;
                                        display:flex;
                                                    justify-content:center;
                                                                align-items:center;
                                                                            height:100vh;
                                                                                    }

                                                                                            .box{
                                                                                                        width:200px;
                                                                                                                    height:200px;
                                                                                                                                background:gold;
                                                                                                                                            border-radius:20px;
                                                                                                                                                        transition:0.5s;
                                                                                                                                                                }

                                                                                                                                                                        .box:hover{
                                                                                                                                                                                    background:silver;
                                                                                                                                                                                                transform:scale(1.2) rotate(10deg);
                                                                                                                                                                                                            box-shadow:0px 0px 25px gold;
                                                                                                                                                                                                                    }

                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                            <div class="box"></div>

                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                            </html>
