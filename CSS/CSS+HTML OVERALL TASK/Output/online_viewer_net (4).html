<!DOCTYPE html>
<html>
<head>
    <title>Display Property Example</title>

        <style>

                body{
                            background-color:black;
                                        color:white;
                                                    font-family:Arial;
                                                            }

                                                                    .box1{
                                                                                display:block;
                                                                                            background:gold;
                                                                                                        color:black;
                                                                                                                    padding:20px;
                                                                                                                                margin:10px;
                                                                                                                                        }

                                                                                                                                                .box2{
                                                                                                                                                            display:inline;
                                                                                                                                                                        background:silver;
                                                                                                                                                                                    color:black;
                                                                                                                                                                                                padding:10px;
                                                                                                                                                                                                        }

                                                                                                                                                                                                                .box3{
                                                                                                                                                                                                                            display:inline-block;
                                                                                                                                                                                                                                        width:200px;
                                                                                                                                                                                                                                                    height:100px;
                                                                                                                                                                                                                                                                background:gray;
                                                                                                                                                                                                                                                                            margin:10px;
                                                                                                                                                                                                                                                                                        text-align:center;
                                                                                                                                                                                                                                                                                                    line-height:100px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                    <div class="box1">
                                                                                                                                                                                                                                                                                                                            BLOCK DISPLAY
                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                    <span class="box2">
                                                                                                                                                                                                                                                                                                                                            INLINE DISPLAY
                                                                                                                                                                                                                                                                                                                                                </span>

                                                                                                                                                                                                                                                                                                                                                    <div class="box3">
                                                                                                                                                                                                                                                                                                                                                            INLINE-BLOCK
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                </html>
