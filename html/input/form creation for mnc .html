<!DOCTYPE html>
<html>
<head>
    <title>MNC Job Application Form</title>

        <style>
                body{
                            font-family: Arial;
                                        background-color: #f2f2f2;
                                                }

                                                        .container{
                                                                    width: 500px;
                                                                                margin: auto;
                                                                                            background: white;
                                                                                                        padding: 20px;
                                                                                                                    border-radius: 10px;
                                                                                                                                margin-top: 30px;
                                                                                                                                            box-shadow: 0px 0px 10px gray;
                                                                                                                                                    }

                                                                                                                                                            h1{
                                                                                                                                                                        text-align: center;
                                                                                                                                                                                    color: darkblue;
                                                                                                                                                                                            }

                                                                                                                                                                                                    label{
                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                input, select, textarea{
                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                    margin-top: 5px;
                                                                                                                                                                                                                                                                                margin-bottom: 15px;
                                                                                                                                                                                                                                                                                            border: 1px solid gray;
                                                                                                                                                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                        .gender{
                                                                                                                                                                                                                                                                                                                                    width: auto;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                    button{
                                                                                                                                                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                                                                                                                                                            padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                        background-color: darkblue;
                                                                                                                                                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 5px;
                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                        button:hover{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    background-color: navy;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>MNC Application Form</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Full Name</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" placeholder="Enter your name">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Email</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="email" placeholder="Enter your email">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Phone Number</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="tel" placeholder="Enter phone number">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Date of Birth</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="date">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Gender</label><br><br>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="radio" name="gender" class="gender"> Male
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="radio" name="gender" class="gender"> Female
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="radio" name="gender" class="gender"> Other

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <br><br>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Qualification</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>Select Qualification</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>B.E</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>B.Tech</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option>B.Sc</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option>MCA</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>MBA</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Skills</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea rows="4" placeholder="Enter your skills"></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Upload Resume</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="file">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit">Submit Application</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
